name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-e2e-linux:
    name: Release artifact E2E (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Set up reviewed Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Install reviewed npm
        run: npm install --global npm@12.0.2

      - name: Verify reviewed Node.js and npm
        run: test "$(node --version)" = 'v24.19.0' && test "$(npm --version)" = '12.0.2'

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: 'v1.51.0'

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Validate release artifacts and installer
        run: ./scripts/release-e2e.sh

      - name: Run real npm package consumer E2E
        run: ./scripts/npm-package-e2e.sh --dist dist

  release-e2e-macos:
    name: Release artifact E2E (macOS)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Set up reviewed Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Install reviewed npm
        run: npm install --global npm@12.0.2

      - name: Verify reviewed Node.js and npm
        run: test "$(node --version)" = 'v24.19.0' && test "$(npm --version)" = '12.0.2'

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: 'v1.51.0'

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Validate release artifacts and installer
        run: ./scripts/release-e2e.sh

      - name: Run real npm package consumer E2E
        run: ./scripts/npm-package-e2e.sh --dist dist

  release-homebrew-e2e:
    name: Homebrew Cask E2E (isolated macOS tap)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: 'v1.51.0'

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Generate snapshot and validate Cask Ruby syntax
        run: ./scripts/release-e2e.sh

      - name: Run Homebrew style, audit, and load in temporary tap
        env:
          RELEASE_E2E_TAP: harness-lint/e2e-${{ github.run_id }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          set -eu
          tap_name="$RELEASE_E2E_TAP"
          tap_dir="$(brew --repository)/Library/Taps/${tap_name%/*}/homebrew-${tap_name#*/}"
          cleanup() {
            brew untap --force "$tap_name" >/dev/null 2>&1 || true
            if [ -d "$tap_dir" ]; then rm -rf "$tap_dir"; fi
          }
          trap cleanup EXIT INT TERM

          # This tap exists only on the hosted runner and is never pushed.
          brew tap-new --no-git "$tap_name"
          mkdir -p "$tap_dir/Casks"
          cp dist/homebrew/Casks/harness-lint.rb "$tap_dir/Casks/harness-lint.rb"
          brew style --cask "$tap_dir/Casks/harness-lint.rb"
          # Snapshot URLs do not exist before publication; keep audit local so
          # it remains a deterministic style/metadata check.
          brew audit --cask --strict "$tap_name/harness-lint"
          brew cat --cask "$tap_name/harness-lint" >/dev/null

  release:
    name: Release stable tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs:
      - release-e2e-linux
      - release-e2e-macos
      - release-homebrew-e2e
    steps:
      - name: Check Homebrew tap credential
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo '::error::HOMEBREW_TAP_TOKEN is not configured'
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate stable annotated tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          tag=${GITHUB_REF_NAME:?missing tag name}
          case "$tag" in
            v*) ;;
            *) echo "::error::release tag must begin with v"; exit 1 ;;
          esac
          if ! printf '%s\n' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::release tag must be a stable vX.Y.Z version"
            exit 1
          fi
          npm_version=${tag#v}
          [ "v$npm_version" = "$tag" ] || { echo '::error::release tag version derivation failed'; exit 1; }
          printf 'NPM_VERSION=%s\n' "$npm_version" >> "$GITHUB_ENV"

          if [ "$(git cat-file -t "$tag")" != tag ]; then
            echo '::error::release tag must be an annotated tag'
            exit 1
          fi
          tag_commit=$(git rev-parse "$tag^{}")
          if [ "$(git rev-parse HEAD)" != "$tag_commit" ]; then
            echo '::error::checked out commit does not match the release tag'
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo '::error::release tag commit is not reachable from origin/main'
            exit 1
          fi

          release_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag")
          case "$release_status" in
            404) ;;
            200) echo '::error::a GitHub Release already exists for this tag'; exit 1 ;;
            *) echo "::error::unable to establish GitHub Release absence (HTTP $release_status)"; exit 1 ;;
          esac

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Set up reviewed Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Install reviewed npm
        run: npm install --global npm@12.0.2

      - name: Verify reviewed Node.js and npm
        run: test "$(node --version)" = 'v24.19.0' && test "$(npm --version)" = '12.0.2'

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: 'v1.51.0'

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Check diff
        run: git diff --check

      - name: Run stable release quality gate
        run: ./scripts/release-workflow-test.sh

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test -count=1 ./...

      - name: Run race tests
        run: go test -race -count=1 ./...

      - name: Run vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -o "$RUNNER_TEMP/harness-lint" ./cmd/harness-lint

      - name: Run installer tests
        run: ./scripts/install_test.sh

      - name: Run isolated CLI smoke
        run: ./scripts/isolated-smoke.sh "$RUNNER_TEMP/harness-lint"

      - name: Check GoReleaser configuration
        run: goreleaser check

      - name: Create draft release and generate Homebrew cask
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish normalized Homebrew cask once
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -eu
          python3 scripts/publish_homebrew_cask.py \
            --dist-cask dist/homebrew/Casks/harness-lint.rb \
            --owner kespineira \
            --repository homebrew-tap \
            --branch main \
            --path Casks/harness-lint.rb

      - name: Validate actual stable release output
        run: ./scripts/validate-release-dist.sh --dist dist --version "$NPM_VERSION"

      - name: Sign checksums
        run: |
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      - name: Verify checksum signature
        run: |
          cosign verify-blob dist/checksums.txt \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'

      - name: Resolve canonical release version
        id: release_version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Attest GoReleaser release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Attest macOS amd64 SPDX 2.3 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/harness-lint_${{ steps.release_version.outputs.version }}_darwin_amd64.tar.gz
          sbom-path: dist/harness-lint_${{ steps.release_version.outputs.version }}_darwin_amd64.tar.gz.spdx.json

      - name: Attest macOS arm64 SPDX 2.3 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/harness-lint_${{ steps.release_version.outputs.version }}_darwin_arm64.tar.gz
          sbom-path: dist/harness-lint_${{ steps.release_version.outputs.version }}_darwin_arm64.tar.gz.spdx.json

      - name: Attest Linux amd64 SPDX 2.3 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/harness-lint_${{ steps.release_version.outputs.version }}_linux_amd64.tar.gz
          sbom-path: dist/harness-lint_${{ steps.release_version.outputs.version }}_linux_amd64.tar.gz.spdx.json

      - name: Attest Linux arm64 SPDX 2.3 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/harness-lint_${{ steps.release_version.outputs.version }}_linux_arm64.tar.gz
          sbom-path: dist/harness-lint_${{ steps.release_version.outputs.version }}_linux_arm64.tar.gz.spdx.json

      - name: Verify archive attestations before npm staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/verify-release-attestations.sh --dist dist --version "$NPM_VERSION" --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"

      - name: Upload checksum signature bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/checksums.txt.sigstore.json --repo "$GITHUB_REPOSITORY"

      - name: Stage npm packages from the validated tag version
        run: ./scripts/stage-npm-packages.sh --version "$NPM_VERSION" --dist dist --output dist/npm-staging

      - name: Pack and audit all five npm tarballs
        run: ./scripts/pack-npm-packages.sh --staging dist/npm-staging --output dist/npm-packages

      - name: Upload audited npm publication inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-inputs-${{ github.sha }}
          path: dist/npm-packages
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  npm-publish:
    name: Publish npm packages with Trusted Publishing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: release
    steps:
      - name: Check out exact tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download audited npm publication inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-inputs-${{ github.sha }}
          path: dist/npm-packages

      - name: Set up reviewed Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Install reviewed npm
        run: npm install --global npm@12.0.2

      - name: Verify reviewed Node.js and npm
        run: test "$(node --version)" = 'v24.19.0' && test "$(npm --version)" = '12.0.2'

      - name: Publish native packages then root with OIDC
        run: ./scripts/publish-npm-packages.sh --tag "$GITHUB_REF_NAME" --packages dist/npm-packages

  publish-github-release:
    name: Publish GitHub draft after npm provenance gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: npm-publish
    steps:
      - name: Publish release draft as stable/latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
