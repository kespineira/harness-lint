name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Go verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up reviewed Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Install reviewed npm
        run: npm install --global npm@12.0.2

      - name: Verify reviewed Node.js and npm
        run: test "$(node --version)" = 'v24.19.0' && test "$(npm --version)" = '12.0.2'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Check diff
        run: git diff --check

      - name: Run release workflow policy test
        run: ./scripts/release-workflow-test.sh

      - name: Run published release smoke workflow policy test
        run: ./scripts/published-release-smoke-workflow-test.sh

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test -count=1 ./...

      - name: Verify runtime conformance fixtures
        run: go test -count=1 ./internal/runtime -run '^TestRuntimeConformanceFixtureManifests$'

      - name: Verify migration upgrades
        run: go test -count=1 ./internal/store -run 'TestV5MigrationBackfillsEvidenceAndRunsIdempotently|TestV6UpgradePreservesUsageProvenanceAndDoesNotBackfillEpochs'

      - name: Verify public JSON regression and privacy
        run: go test -count=1 ./internal/cli -run 'TestPublicJSONContractsAreStableAndPrivacySafe|TestDatabaseHelpAndStatusJSONAreStableAndPrivate|TestDatabaseCheckErrorAndBackupOutputs'

      - name: Run race tests
        run: go test -race -count=1 ./...

      - name: Run vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -o "$RUNNER_TEMP/harness-lint" ./cmd/harness-lint

      - name: Run isolated CLI smoke
        run: ./scripts/isolated-smoke.sh "$RUNNER_TEMP/harness-lint"

      - name: Run installer tests
        run: ./scripts/install_test.sh

      - name: Run deterministic npm staging tests
        run: ./scripts/stage-npm-packages-test.sh

      - name: Run deterministic npm packing tests
        run: ./scripts/pack-npm-packages-test.sh

      - name: Run resumable npm publication security tests
        run: ./scripts/publish-npm-packages-test.sh

      - name: Run isolated npm package consumer E2E fixture
        run: ./scripts/npm-package-e2e-test.sh
